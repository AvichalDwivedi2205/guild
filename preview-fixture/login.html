<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cinema fixture · Login</title>
    <link rel="stylesheet" href="/fixture.css" />
    <script src="/preview-bridge.js" defer></script>
    <script src="/fixture.js" defer></script>
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <a class="brand" href="/index.html">CINEMA<span>+</span></a>
      <form class="auth-card" data-login-form>
        <p class="eyebrow">Welcome back</p>
        <h1>Continue watching.</h1>
        <p>Your films, lists, and recommendations are waiting.</p>
        <label
          >Email address<input required type="email" name="email" placeholder="you@example.com"
        /></label>
        <label
          >Password<input required type="password" name="password" value="cinema-demo"
        /></label>
        <button class="primary" type="submit">Sign in</button>
        <p class="form-status" role="status"></p>
      </form>
    </main>
  </body>
</html>
