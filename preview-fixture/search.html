<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cinema fixture · Search</title>
    <link rel="stylesheet" href="/fixture.css" />
    <script src="/preview-bridge.js" defer></script>
    <script src="/fixture.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/index.html">CINEMA<span>+</span></a>
      <nav aria-label="Primary">
        <a href="/index.html">Discover</a><a aria-current="page" href="/search.html">Search</a
        ><a href="/watchlist.html">My list</a>
      </nav>
      <a class="avatar" href="/profile.html">AD</a>
    </header>
    <main class="page-shell">
      <p class="eyebrow">Explore the catalogue</p>
      <h1>Search cinema</h1>
      <form class="search-bar" role="search">
        <input name="query" aria-label="Search titles" placeholder="Try “neon” or “drama”" /><button
          class="primary"
        >
          Search
        </button>
      </form>
      <div class="chips">
        <button class="active">All</button><button>Films</button><button>Series</button
        ><button>Documentaries</button>
      </div>
      <p class="result-count" role="status">6 results selected for you</p>
      <div class="result-grid">
        <a class="result-card" data-search-title="Neon Horizon science fiction" href="/movie.html"
          ><div class="thumb violet">NH</div>
          <div><strong>Neon Horizon</strong><small>2026 · Sci-fi</small></div></a
        >
        <button class="result-card" data-search-title="The Last Signal drama">
          <div class="thumb ember">LS</div>
          <div><strong>The Last Signal</strong><small>2025 · Drama</small></div>
        </button>
        <button class="result-card" data-search-title="Blue Hour thriller">
          <div class="thumb ocean">BH</div>
          <div><strong>Blue Hour</strong><small>2026 · Thriller</small></div>
        </button>
        <button class="result-card" data-search-title="Wild Light documentary">
          <div class="thumb moss">WL</div>
          <div><strong>Wild Light</strong><small>2024 · Documentary</small></div>
        </button>
        <button class="result-card" data-search-title="Parallel Lines romance">
          <div class="thumb rose">PL</div>
          <div><strong>Parallel Lines</strong><small>2025 · Romance</small></div>
        </button>
        <button class="result-card" data-search-title="Quiet City drama">
          <div class="thumb gold">QC</div>
          <div><strong>Quiet City</strong><small>2026 · Drama</small></div>
        </button>
      </div>
    </main>
  </body>
</html>
