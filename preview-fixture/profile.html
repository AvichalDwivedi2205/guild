<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cinema fixture · Profile</title>
    <link rel="stylesheet" href="/fixture.css" />
    <script src="/preview-bridge.js" defer></script>
    <script src="/fixture.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/index.html">CINEMA<span>+</span></a>
      <nav aria-label="Primary">
        <a href="/index.html">Discover</a><a href="/search.html">Search</a
        ><a href="/watchlist.html">My list</a>
      </nav>
      <a class="avatar active" href="/profile.html">AD</a>
    </header>
    <main class="page-shell narrow">
      <p class="eyebrow">Account</p>
      <h1>Your profile</h1>
      <section class="profile-card">
        <div class="profile-avatar">AD</div>
        <div>
          <h2>Avichal Dwivedi</h2>
          <p>Member since September 2026</p>
        </div>
        <button>Edit profile</button>
      </section>
      <section class="settings-card">
        <h2>Playback preferences</h2>
        <label class="toggle"
          ><span
            ><strong>Autoplay next episode</strong
            ><small>Continue a series without interruption</small></span
          ><input type="checkbox" checked /></label
        ><label class="toggle"
          ><span
            ><strong>High-quality streaming</strong
            ><small>Use the best quality available</small></span
          ><input type="checkbox" checked /></label
        ><label
          ><span>Preferred language</span
          ><select>
            <option>English</option>
            <option>Hindi</option>
            <option>French</option>
          </select></label
        >
      </section>
    </main>
  </body>
</html>
